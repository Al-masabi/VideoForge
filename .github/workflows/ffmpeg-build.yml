name: Build FFmpeg Native

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ffmpeg:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 36
          accept-android-sdk-licenses: true

      - name: Locate NDK
        run: |
          export ANDROID_NDK_HOME=$(ls -d $ANDROID_HOME/ndk/* | sort -V | tail -1)
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> $GITHUB_ENV

      - name: Build FFmpeg for Android ABIs
        run: |
          chmod +x scripts/build-ffmpeg.sh
          ./scripts/build-ffmpeg.sh

      - name: Upload native libraries
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-native-libs
          path: |
            engine/ffmpeg-native/src/main/jniLibs
            engine/ffmpeg-native/src/main/cpp/ffmpeg
          retention-days: 30