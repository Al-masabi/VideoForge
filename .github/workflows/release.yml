name: Release Build

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 36
          accept-android-sdk-licenses: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13.0'

      - name: Generate Gradle wrapper
        run: |
          gradle wrapper --gradle-version 8.13.0 --distribution-type bin
          chmod +x ./gradlew

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > $RUNNER_TEMP/videoforge.keystore

      - name: Build signed APK and AAB
        env:
          VF_KEYSTORE_PATH: ${{ runner.temp }}/videoforge.keystore
          VF_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VF_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          VF_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --stacktrace --no-daemon

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: videoforge-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          generate_release_notes: true